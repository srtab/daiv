[project]
name = "inventory-api"
version = "0.4.0"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "fastapi[standard]>=0.115",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8",
]

[tool.pytest]
ini_options.testpaths = [ "tests" ]
