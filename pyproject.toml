[project]
name = "daiv"
version = "2.0.0"
description = """\
  Async SWE agents seamlessly integrated on your git platform to automate code issues implementation, reviews, and \
  pipeline repairs.\
  """
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Sandro Rodrigues", email = "srtabs@gmail.com" },
]
authors = [
  { name = "Sandro Rodrigues", email = "srtabs@gmail.com" },
]
requires-python = ">=3.14,<3.15"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "ag-ui-langgraph==0.0.47",
  "ag-ui-protocol<1",
  "copilotkit==0.1.96",
  "croniter==6.2.4",
  "ddgs==9.16.1",
  "deepagents==0.7.32",
  "django==6.1.2",
  "django-allauth[mfa,socialaccount]==65.21.0",
  "django-crontask==2.2.0",
  "django-extensions==4.1",
  "django-filter==26.2",
  "django-ninja==1.7.1",
  "django-oauth-toolkit==3.4.1",
  "django-split-settings==1.3.2",
  "django-tasks-db==0.13.0",
  "fastmcp-slim[client]==4.1.4",
  "genai-prices==0.1.13",
  "get-docker-secret==2.0.0",
  "gitpython==3.2.1",
  "httpx==0.28.1",
  "ipython==9.17.1",
  "jinja2==3.1.6",
  "langchain[anthropic,community,google-genai,openai]==1.4.7",
  "langchain-anthropic==1.7.6",
  "langgraph==1.2.18",
  "langgraph-checkpoint-redis==0.5.2",
  "langsmith[pytest]==0.14.14",
  "langsmith-fetch==0.3.1",
  "markdown==3.11.2",
  "markdownify==1.2.3",
  "mcp==2.3.0",
  "nh3==0.3.7",
  "parable",
  "prompt-toolkit==3.0.53",
  "psycopg[pool]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "pygithub==2.10.0",
  "python-decouple==3.8",
  "python-gitlab==8.6.0",
  "pyyaml==6.0.3",
  "rank-bm25==0.2.2",
  "redis==8.1.0",
  "sentry-sdk==2.73.0",
  "unidiff==1.0.1",
  "uvicorn[standard]==0.54.0",
  "whitenoise==6.12.0",
]
urls.changelog = "https://github.com/srtab/daiv/blob/main/CHANGELOG.md"
urls.issues = "https://github.com/srtab/daiv/issues"
urls.source = "https://github.com/srtab/daiv"

[dependency-groups]
dev = [
  "coverage==7.17.0",
  "datasets==5.1.0",
  "djade==1.10.0",
  "django-stubs==6.1.2",
  "import-linter==2.15",
  "openevals==0.2.2",
  "prek==0.5.7",
  "pyproject-fmt==2.30.3",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.1",
  "pytest-cov==7.1.0",
  "pytest-django==4.14.0",
  "pytest-env==1.8.3",
  "pytest-httpx==0.36.2",
  "pytest-mock==3.17.0",
  "pytest-xdist==3.8.0",
  "python-dotenv==1.2.4",
  "ruff==0.17.3",
  "ty==0.0.92",
  "types-pyyaml==6.0.12.20260906",
  "watchdog==6.0.0",
]
docs = [
  "mike==2.2.0",
  "mkdocs==1.6.1",
  "mkdocs-git-revision-date-localized-plugin==1.6.2",
  "mkdocs-llmstxt==0.5.1",
  "mkdocs-material==9.7.7",
]

[tool.uv]
default-groups = [ "docs", "dev" ]
sources.parable = { git = "https://github.com/ldayton/Parable.git", rev = "9f7e15734bd3e5bb9fe252d2491d6f61572f0e57" }

[tool.ruff]
line-length = 120
extend-exclude = [ "*/node_modules/*", "*/static/*" ]
force-exclude = true
preview = true
unsafe-fixes = true
show-fixes = true
format.skip-magic-trailing-comma = true
lint.select = [
  # flake8-builtins
  "A",
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # flake8-django
  "DJ",
  # pycodestyle
  "E",
  # eradicate
  "ERA",
  # Pyflakes
  "F",
  # flake8-logging-format
  "G",
  # isort
  "I",
  # flake8-logging
  "LOG",
  # pep8-naming
  "N",
  # flake8-use-pathlib
  "PTH",
  # flake8-bandit
  "S",
  # flake8-simplify
  "SIM",
  # flake8-print
  "T20",
  # flake8-type-checking
  "TCH",
  # pyupgrade
  "UP",
  # pycodestyle
  "W",
]
lint.ignore = [ "N812", "S101" ]
lint.per-file-ignores."*/migrations/*" = [ "E501" ]
lint.isort.known-first-party = [
  "accounts",
  "automation",
  "chat",
  "codebase",
  "core",
  "schedules",
  "slash_commands",
  "daiv",
]
lint.isort.section-order = [
  "future",
  "standard-library",
  "django",
  "third-party",
  "first-party",
  "local-folder",
]
lint.isort.sections.django = [ "django" ]
lint.isort.split-on-trailing-comma = false

[tool.pyproject-fmt]
keep_full_version = true

[tool.ty]
src.exclude = [ "**/docs/**", "**/tests/**" ]
environment.python-version = "3.14"
terminal.error-on-warning = true

# Files that still fail ty. Remove a file once it passes; never add one.
