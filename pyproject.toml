[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.pythonpath = [ "daiv", "." ]
ini_options.norecursedirs = [
  ".venv",
  "data",
  "docker",
  "docs",
  "evals",
  "node_modules",
  "static",
]
ini_options.python_files = "test_*.py"
ini_options.python_classes = "Test *Test"
ini_options.addopts = "--cov --cov-config=.coveragerc -p no:warnings --strict-markers"
ini_options.markers = [
  "ask_user: integration test that the agent asks the user on an ambiguous request (paid model calls)",
  "code_review: scored recall eval of the /code-review skill on planted bugs, in a sandbox (paid model calls)",
  "deferred_cache: integration probe of prompt-cache hits across a deferred-tool load (paid model calls)",
  "deferred_frozen: integration test asserting deferred-tool schemas are frozen",
  "diff_to_metadata: scored eval of the diff-to-metadata agent (paid model calls)",
  "memory: scored eval of repository-memory extraction and consolidation (paid model calls)",
  "own_replies: test registers its own webhook reply responses; skips the blanket sendMessage mock",
  "sandbox: integration test against a real sandbox executor",
  "skills: integration test of built-in agent skills",
  "subagents: integration test of the explore subagent's tools and report (paid model calls)",
  "todos: integration test that multi-step work is planned with write_todos (paid model calls)",
  "web_search: integration test of web search queries and source citation (paid model calls)",
]
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "auto"
ini_options.DJANGO_SETTINGS_MODULE = "daiv.settings.test"

[tool.pytest_env]
# Applies to --envfile too (integration runs), so an exported credential beats the dev env file.
env_files_skip_if_set = true
DJANGO_SETTINGS_MODULE = "daiv.settings.test"
DJANGO_SECRET_KEY = "not-so-secret"
ANTHROPIC_API_KEY = { value = "anthropic-api-key", skip_if_set = true }
OPENAI_API_KEY = { value = "openai-api-key", skip_if_set = true }
CODEBASE_GITLAB_WEBHOOK_SECRET = "gitlab-webhook-secret"
CODEBASE_GITHUB_INSTALLATION_ID = "123456"
NINJA_SKIP_REGISTRY = true
