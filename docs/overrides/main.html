{% extends "base.html" %}

{% block htmltitle %}
  {% if page.meta and page.meta.html_title %}
    <title>{{ page.meta.html_title }} - {{ config.site_name }}</title>
  {% else %}
    {{ super() }}
  {% endif %}
{% endblock %}

{% block extrahead %}
  {% if config.extra.noindex %}
    <meta name="robots" content="noindex">
  {% endif %}
{% endblock %}
