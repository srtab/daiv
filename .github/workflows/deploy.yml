name: Deploy

# Continuous deployment to the production server (daivagent).
#
# Runs after the "Docker" workflow finishes building & pushing
# ghcr.io/srtab/daiv:main for a push to main, then SSHes into the server and
# rolls the app/worker/scheduler containers (plus worker-interactive where the server
# compose defines it) onto the new image. Can also be run
# manually from the Actions tab to re-deploy :main or roll back to a pinned
# per-commit tag (e.g. sha-5e4f0d0); the script validates that the server
# compose file honors DAIV_IMAGE_TAG (its error message states the contract).
on:
  workflow_run:
    workflows: ["Docker"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (main, or a pinned sha-XXXXXXX tag to roll back)"
        required: false
        default: "main"

permissions:
  contents: read

# Never let two deploys touch the server at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploy only on a manual run, or when the Docker build succeeded for a
    # push to main (skips PR builds and tag builds — the server tracks :main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'main' }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
          command_timeout: 8m
          envs: IMAGE_TAG,EXPECTED_SHA
          script: |
            set -e
            cd /home/daiv

            SERVICES="app worker scheduler"
            export DAIV_IMAGE_TAG="${IMAGE_TAG:?IMAGE_TAG env not forwarded}"

            # The queue-split worker is optional server-side: roll it only where it is defined,
            # so a server that has not adopted it yet still deploys.
            if docker compose config --services | grep -qx worker-interactive; then
              SERVICES="$SERVICES worker-interactive"
            fi

            # STRICT=1 (pinned sha rollback) fails unless that exact build ends up serving;
            # continuous deploys verify softly, tolerating being superseded by a newer :main.
            STRICT=0
            if [ "$DAIV_IMAGE_TAG" != "main" ]; then
              for svc in $SERVICES; do
                if ! docker compose config "$svc" | grep -qF -- "ghcr.io/srtab/daiv:${DAIV_IMAGE_TAG}"; then
                  echo "ERROR: service '${svc}' ignored DAIV_IMAGE_TAG=${DAIV_IMAGE_TAG}." >&2
                  echo "Every service must reference the image as ghcr.io/srtab/daiv:\${DAIV_IMAGE_TAG:-main}." >&2
                  exit 1
                fi
              done
              case "$DAIV_IMAGE_TAG" in
                sha-*) EXPECTED_SHA="${DAIV_IMAGE_TAG#sha-}"; STRICT=1 ;;
              esac
            fi

            echo "Pulling images (tag: ${DAIV_IMAGE_TAG})..."
            docker compose pull $SERVICES

            echo "Recreating containers..."
            docker compose up -d $SERVICES

            echo "Pruning dangling images..."
            docker image prune -f

            echo "Waiting for app to become healthy..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/-/alive/ >/dev/null 2>&1; then
                BUILD="$(curl -fsS http://127.0.0.1:8000/-/version/ 2>/dev/null || true)"
                if [ -n "$EXPECTED_SHA" ] && ! printf '%s' "$BUILD" | grep -qF -- "$EXPECTED_SHA"; then
                  if [ "$STRICT" = "1" ]; then
                    echo "  app is up but not yet serving the pinned build ($i/30); retrying in 5s..."
                    sleep 5
                    continue
                  fi
                  echo "WARNING: healthy, but serving a different build than this run built (expected ${EXPECTED_SHA}; got: ${BUILD:-no /-/version/ endpoint}). Likely superseded by a newer push to main."
                fi
                echo "App is healthy. Build: ${BUILD:-unknown (no /-/version/ endpoint)}"
                docker compose ps $SERVICES
                exit 0
              fi
              echo "  not ready yet ($i/30); retrying in 5s..."
              sleep 5
            done

            echo "ERROR: app did not become healthy (expected build '${EXPECTED_SHA:-any}') within 150s" >&2
            docker compose ps $SERVICES
            docker compose logs --tail=50 app >&2 || true
            exit 1
