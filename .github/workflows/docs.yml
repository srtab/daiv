name: Documentation

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          # git-revision-date-localized warns on a shallow clone, which --strict turns into a failure.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install docs dependencies
        run: uv sync --locked --only-group=docs

      - name: Test build docs as a release
        run: |
          uv run --only-group=docs mkdocs build --clean --strict
          grep -qF '<link rel="canonical" href="https://srtab.github.io/daiv/latest/">' site/index.html
          if grep -qF 'name="robots"' site/index.html; then echo "release build is noindex"; exit 1; fi
        env:
          MIKE_DOCS_VERSION: v0.0.0

      - name: Test build docs as the dev version
        run: |
          uv run --only-group=docs mkdocs build --clean --strict
          grep -qF '<link rel="canonical" href="https://srtab.github.io/daiv/dev/">' site/index.html
          grep -qF '<meta name="robots" content="noindex">' site/index.html
        env:
          MIKE_DOCS_VERSION: dev

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install docs dependencies
        run: uv sync --locked --only-group=docs

      - name: Set git credentials
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Fetch latest changes
        run: git fetch origin gh-pages

      - name: Deploy docs dev version
        run: uv run --only-group=docs mike deploy dev --push
        if: github.ref == 'refs/heads/main'

      - name: Deploy docs release version
        run: uv run --only-group=docs mike deploy ${{ github.ref_name }} latest --update-aliases --push
        if: startsWith(github.ref, 'refs/tags/')
