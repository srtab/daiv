site_name: DAIV
site_url: https://srtab.github.io/daiv/
repo_url: https://github.com/srtab/daiv
site_description: >-
  DAIV is an open-source, self-hosted SWE agent for GitLab and GitHub that turns
  issues into merge requests, answers review comments, and fixes failing CI.
site_author: Sandro Rodrigues
strict: true
edit_uri: edit/main/docs/

validation:
  anchors: warn

# Gitignored local scratch (.gitignore: docs/superpowers/) that lives inside docs_dir.
exclude_docs: |
  superpowers/
  /overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - search.highlight
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.tracking
    - navigation.path
    - content.code.annotate
    - content.code.copy
    - content.action.edit

  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

hooks:
  - docs/overrides/hooks/seo.py

plugins:
  - mike:
      canonical_version: latest
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        DAIV is an open-source async software engineering agent that integrates
        natively with GitLab and GitHub through webhooks. Create an issue, get a
        merge request. Mention DAIV in a review, get the fix. Licensed under
        Apache 2.0.
      sections:
        Getting Started:
        - getting-started/deployment.md
        - getting-started/platform-setup.md
        - getting-started/accounts.md
        - getting-started/llm-providers.md
        Features:
        - features/issue-addressing.md
        - features/pull-request-assistant.md
        - features/pipeline-watch.md
        - features/sessions.md
        - features/jobs-api.md
        - features/scheduled-jobs.md
        - features/orchestration.md
        - features/mcp-endpoint.md
        - features/notifications.md
        - features/merge-metrics.md
        - features/slash-commands.md
        - features/subagents.md
        - features/sandbox.md
        - features/sandbox-environments.md
        Integrations:
        - integrations/rt/index.md
        Customization:
        - customization/repository-config.md
        - customization/agent-skills.md
        - customization/mcp-tools.md
        Reference:
        - reference/env-variables.md
        - reference/site-configuration.md
        - reference/agent-architecture.md
        - reference/monitoring.md
        Community:
        - community.md

markdown_extensions:
  - attr_list
  - admonition
  - tables
  - md_in_html
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      auto_title: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  generator: false
  version:
    provider: mike

nav:
  - Home: index.md
  - Getting Started:
    - Deployment: getting-started/deployment.md
    - Platform Setup: getting-started/platform-setup.md
    - Accounts & Roles: getting-started/accounts.md
    - LLM Providers: getting-started/llm-providers.md
  - Features:
    - Issue Addressing: features/issue-addressing.md
    - Pull Request Assistant: features/pull-request-assistant.md
    - Pipeline Watch: features/pipeline-watch.md
    - Sessions: features/sessions.md
    - Jobs API: features/jobs-api.md
    - Scheduled Jobs: features/scheduled-jobs.md
    - Orchestration: features/orchestration.md
    - MCP Endpoint: features/mcp-endpoint.md
    - Notifications: features/notifications.md
    - Merge Metrics: features/merge-metrics.md
    - Slash Commands & Skills: features/slash-commands.md
    - Subagents: features/subagents.md
    - Sandbox: features/sandbox.md
    - Sandbox Environments: features/sandbox-environments.md
  - Integrations:
    - Request Tracker Triage: integrations/rt/index.md
  - Customization:
    - Repository Config: customization/repository-config.md
    - Agent Skills: customization/agent-skills.md
    - MCP Tools: customization/mcp-tools.md
  - Reference:
    - Environment Variables: reference/env-variables.md
    - Site Configuration: reference/site-configuration.md
    - Agent Architecture: reference/agent-architecture.md
    - Monitoring: reference/monitoring.md
  - Community: community.md
