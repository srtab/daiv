{% load i18n %}
{% if error %}
<ul><li class="picker-popover__error">{% translate "Could not load branches." %}</li></ul>
{% else %}
<ul>
{% for branch in branches %}
  <li>
    <button type="button"
            class="picker-popover__option flex items-center justify-between"
            @click="setBranch('{{ branch|escapejs }}')">
      <span class="text-white">{{ branch }}</span>
      {% if branch == selected %}<span class="text-emerald-400">✓</span>{% endif %}
    </button>
  </li>
{% empty %}
  <li class="picker-popover__empty">{% translate "No branches found." %}</li>
{% endfor %}
</ul>
{% endif %}
