<footer class="landing-footer">
    <div class="landing-container flex flex-col items-center justify-between gap-4 sm:flex-row">
        <p class="text-center text-[13px] text-text-muted sm:text-left">DAIV &mdash; Open-source, self-hosted SWE agents for GitLab &amp; GitHub</p>
        <div class="flex flex-wrap items-center justify-center gap-x-6 gap-y-2">
            <a href="{{ build_info.docs_url }}" rel="noopener noreferrer" class="landing-footer__link">Documentation</a>
            <a href="https://github.com/srtab/daiv" rel="noopener noreferrer" class="landing-footer__link">GitHub</a>
            <a href="https://github.com/srtab/daiv/blob/main/LICENSE" rel="noopener noreferrer" class="landing-footer__link">License</a>
            {% for link in social_links %}
            <a href="{{ link.url }}" rel="me noopener noreferrer" class="landing-footer__link">{{ link.name }}</a>
            {% endfor %}
        </div>
    </div>
</footer>
