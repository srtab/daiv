{% load icon_tags nav_tags %}
<a href="{{ href }}"
   title="{{ label }}: {{ description }}"
   class="sidebar__nav-item sidebar__nav-item--described {% nav_active section %}">
  {% icon icon "h-4 w-4 shrink-0" %}
  <span class="sidebar__collapsible min-w-0 flex-1">
    <span class="block">{{ label }}</span>
    <span data-testid="nav-description" class="nav-description">{{ description }}</span>
  </span>
</a>
