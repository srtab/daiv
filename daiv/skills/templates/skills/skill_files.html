{% extends "skills/skill_page.html" %}

{% block skill_tab %}
<ul class="divide-y divide-border overflow-hidden rounded-2xl border border-border bg-surface-2">
    {% for entry in skill.files %}
    <li class="flex items-center justify-between gap-4 px-4 py-2.5">
        <span class="min-w-0 truncate font-mono text-[13px] text-text">{{ entry.path }}</span>
        <span class="shrink-0 font-mono text-[12px] tabular-nums text-text-faint">{{ entry.size|filesizeformat }}</span>
    </li>
    {% endfor %}
</ul>
{% endblock skill_tab %}
