{% load i18n icon_tags %}
{% if header.repositories %}
<template x-if="repositories">
<section class="session-repositories" aria-label="{% translate 'Repositories' %}">
    <template x-for="(repo, index) in repositories.rows" :key="repo.repo_id">
    <div class="session-repositories__row">
        <span class="session-repo" :title="repo.repo_id">{% icon "repo" "h-3 w-3 shrink-0" %}<span class="truncate" x-text="repo.repo_id"></span></span>
        <template x-if="index === 0"><span class="session-repositories__main">{% translate "main" %}</span></template>
        <template x-if="repo.ref"><span class="session-branch min-w-0" :title="repo.ref">{% icon "branch" "h-3 w-3 shrink-0" %}<span class="truncate" x-text="repo.ref"></span></span></template>
        <template x-if="repo.mr_url">
        <a :href="repo.mr_url" target="_blank" rel="noopener" class="mr-pill shrink-0">{% icon "merge-request" "h-3 w-3" %}<span x-text="repo.mr_iid ? '!' + repo.mr_iid : '{{ _("Merge request")|escapejs }}'"></span></a>
        </template>
        <template x-if="!repo.mr_url && repo.mr_iid">
        <span class="mr-pill shrink-0">{% icon "merge-request" "h-3 w-3" %}<span x-text="'!' + repo.mr_iid"></span></span>
        </template>
    </div>
    </template>
    <template x-if="repositories.publish_errors.length">
    <ul class="session-repositories__errors" role="alert">
        <template x-for="(item, index) in repositories.publish_errors" :key="index">
        <li><span class="font-mono" x-text="item.repo_id"></span>: <span x-text="item.error"></span></li>
        </template>
    </ul>
    </template>
</section>
</template>
{% endif %}
