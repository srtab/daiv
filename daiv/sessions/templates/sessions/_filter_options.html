{% load query_tags %}
{% for value, option_label in options %}
<a href="{% querystring request.GET key|query_param:value page=None scope=current_scope|default:None %}" data-filter-key="{{ key }}" data-value="{{ value }}" data-label="{{ option_label }}"
   class="filter-menu-item{% if value == current %} filter-menu-item--active{% endif %}"
   @click.prevent="pick('{{ key }}', $el.dataset.value)" :class="{ 'filter-menu-item--active': value('{{ key }}') === $el.dataset.value }">
    {% if lead %}<span class="filter-menu-item__lead">{% include "sessions/_filter_lead.html" %}</span>{% endif %}<span class="truncate">{{ option_label }}</span>
</a>
{% endfor %}
