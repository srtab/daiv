{% load i18n %}
<template x-if="block.publish.length">
  <div class="publish-rows">
    <p class="publish-rows__label">{% translate "Published" context "publish rows heading" %}</p>
    <template x-for="(p, pi) in block.publish" :key="pi">
      <div class="chat-inbox-event"
           :class="{ 'chat-inbox-event--failed': publishFailed(p), 'chat-inbox-event--published': !publishFailed(p) }"
           data-testid="publish-row" :data-status="p.status"
           :role="publishFailed(p) && !p.sibling ? 'status' : null"
           :aria-live="publishFailed(p) && !p.sibling ? 'polite' : null"
           :data-run-ending="publishFailed(p) && !p.sibling && !block.items.length ? '' : false">
        <span class="chat-inbox-event__dot" aria-hidden="true"></span>
        <span class="chat-inbox-event__kind">
          <template x-if="p.status === 'opened'"><span>{% translate "Opened" %}</span></template>
          <template x-if="p.status === 'pushed' && p.merge_request_iid"><span>{% translate "Pushed to" %}</span></template>
          <template x-if="p.status === 'pushed' && !p.merge_request_iid"><span>{% translate "Pushed" %}</span></template>
          <template x-if="publishFailed(p)"><span>{% translate "Not published" %}</span></template>
        </span>
        <span class="chat-inbox-event__repo" :title="p.repository" x-text="p.repository"></span>
        <template x-if="p.merge_request_iid">
          <a class="chat-inbox-event__mr" :href="p.merge_request_web_url || null" target="_blank" rel="noopener noreferrer"
             x-text="'!' + p.merge_request_iid"></a>
        </template>
        <template x-if="p.merge_request_title">
          <span class="chat-inbox-event__summary" :title="p.merge_request_title" x-text="p.merge_request_title"></span>
        </template>
        {% include "sessions/_line_counts.html" with counts="({ added: p.lines_added, removed: p.lines_removed })" %}
        <template x-if="p.error">
          <span class="chat-inbox-event__why" x-text="p.error"></span>
        </template>
        <template x-if="p.merge_request_web_url">
          <a class="chat-inbox-event__link" :href="p.merge_request_web_url" target="_blank" rel="noopener noreferrer">{% translate "Open ↗" %}</a>
        </template>
        {% if session %}
          <template x-if="!p.sibling">
            {% include "sessions/_retry_button.html" with turn="p" %}
          </template>
        {% endif %}
      </div>
    </template>
  </div>
</template>
