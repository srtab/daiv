{% if is_paginated %}
<nav class="mt-4 flex items-center justify-between">
    <span class="text-sm text-text-muted">
        Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
    </span>
    <div class="flex items-center gap-2">
        {% if page_obj.has_previous %}
        <a href="{% querystring page=page_obj.previous_page_number %}"{% if paginate_swap %} data-page-swap{% endif %}
           class="rounded-lg border border-border bg-surface-2 px-3 py-1.5 text-sm font-medium text-text-muted transition-all duration-200 hover:bg-surface-3 hover:text-text-strong">
            &larr; Previous
        </a>
        {% endif %}
        {% if page_obj.has_next %}
        <a href="{% querystring page=page_obj.next_page_number %}"{% if paginate_swap %} data-page-swap{% endif %}
           class="rounded-lg border border-border bg-surface-2 px-3 py-1.5 text-sm font-medium text-text-muted transition-all duration-200 hover:bg-surface-3 hover:text-text-strong">
            Next &rarr;
        </a>
        {% endif %}
    </div>
</nav>
{% endif %}
