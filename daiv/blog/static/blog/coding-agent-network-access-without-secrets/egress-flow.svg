<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f8564e"/></marker>
  </defs>
  <rect width="1200" height="480" fill="#16181d"/>

  <rect x="40" y="150" width="270" height="180" rx="12" fill="#2a2f38"/>
  <text x="175" y="196" fill="#e6edf3" font-size="24" font-weight="600" text-anchor="middle">Sandbox container</text>
  <text x="175" y="240" fill="#9aa4b0" font-size="18" text-anchor="middle">agent commands</text>
  <text x="175" y="268" fill="#9aa4b0" font-size="18" text-anchor="middle">git, including the push</text>
  <text x="175" y="296" fill="#9aa4b0" font-size="18" text-anchor="middle">no credentials</text>

  <line x1="310" y1="240" x2="452" y2="240" stroke="#5eead4" stroke-width="3" marker-end="url(#ok)"/>
  <text x="381" y="276" fill="#9aa4b0" font-size="15" text-anchor="middle">internal network,</text>
  <text x="381" y="296" fill="#9aa4b0" font-size="15" text-anchor="middle">no route out</text>

  <rect x="460" y="120" width="320" height="240" rx="12" fill="#2a2f38" stroke="#5eead4" stroke-width="2"/>
  <text x="620" y="164" fill="#e6edf3" font-size="24" font-weight="600" text-anchor="middle">Egress proxy</text>
  <text x="620" y="190" fill="#9aa4b0" font-size="16" text-anchor="middle">one per session</text>
  <text x="488" y="238" fill="#e6edf3" font-size="18">1. Is the host listed?</text>
  <text x="488" y="270" fill="#e6edf3" font-size="18">2. Is the method allowed?</text>
  <text x="488" y="302" fill="#e6edf3" font-size="18">3. Add the host's credential</text>
  <text x="488" y="334" fill="#9aa4b0" font-size="16">any error: deny</text>

  <line x1="780" y1="190" x2="872" y2="110" stroke="#5eead4" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="780" y1="240" x2="872" y2="240" stroke="#5eead4" stroke-width="3" marker-end="url(#ok)"/>
  <line x1="780" y1="290" x2="872" y2="370" stroke="#f8564e" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#no)"/>

  <rect x="880" y="70" width="290" height="80" rx="12" fill="#2a2f38"/>
  <text x="900" y="104" fill="#e6edf3" font-size="20" font-weight="600">pypi.org</text>
  <text x="900" y="132" fill="#5eead4" font-size="16">allowed, read-only</text>

  <rect x="880" y="200" width="290" height="80" rx="12" fill="#2a2f38"/>
  <text x="900" y="234" fill="#e6edf3" font-size="20" font-weight="600">registry.acme.internal</text>
  <text x="900" y="262" fill="#5eead4" font-size="16">allowed, Authorization added</text>

  <rect x="880" y="330" width="290" height="80" rx="12" fill="#2a2f38"/>
  <text x="900" y="364" fill="#e6edf3" font-size="20" font-weight="600">attacker.example</text>
  <text x="900" y="392" fill="#f8564e" font-size="16">not listed: 403</text>
</svg>
